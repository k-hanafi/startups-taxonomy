[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-startups-taxonomy-research"
version = "2.0.0"
description = "Two-axis classifier for AI-native startups: 10 subclasses plus a RAD score. Production classification uses the OpenAI Responses API."
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "tiktoken>=0.7.0",
    "tenacity>=8.3.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]
# Stats deps for the alive-vs-dead analysis. Kept out of core so the
# classification pipeline stays lean.
analysis = [
    "statsmodels>=0.14.0",
    "scipy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "single_pass_classifier*",
    "two_pass_classifier*",
    "tavily_crawler*",
    "evals*",
    "wayback_machine*",
]

[tool.setuptools.package-data]
single_pass_classifier = ["prompts/*.txt"]
two_pass_classifier = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = [
    "single_pass_classifier/tests",
    "two_pass_classifier/tests",
    "tavily_crawler/tests",
    "evals/tests",
    "wayback_machine/tests",
]
asyncio_mode = "auto"
